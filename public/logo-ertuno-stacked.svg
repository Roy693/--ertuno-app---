<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tuno Fruit Body -->
  <g id="tuno-fruit" transform="translate(35, 10)">
    <!-- Main fruit shape -->
    <ellipse cx="25" cy="25" rx="18" ry="22" fill="url(#tunoGradient)"/>
    
    <!-- Texture dots pattern -->
    <circle cx="20" cy="18" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="30" cy="16" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="16" cy="25" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="34" cy="24" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="22" cy="32" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="32" cy="35" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="18" cy="38" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="28" cy="42" r="1.5" fill="#E55A4E" opacity="0.6"/>
    
    <!-- Green leaf accent -->
    <path d="M25 5 C22 3, 18 5, 18 9 C18 13, 22 15, 25 13 C28 15, 32 13, 32 9 C32 5, 28 3, 25 5 Z" fill="#4CAF50"/>
  </g>
  
  <!-- ERTUNO Text -->
  <g id="ertuno-text">
    <text x="60" y="80" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#2C3E50" text-anchor="middle">ERTUNO</text>
    <text x="60" y="95" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#7F8C8D" text-anchor="middle">Professional Services</text>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="tunoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4757;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA502;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>