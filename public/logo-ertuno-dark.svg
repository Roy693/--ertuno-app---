<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tuno Fruit Body -->
  <g id="tuno-fruit">
    <!-- Main fruit shape -->
    <ellipse cx="25" cy="30" rx="18" ry="22" fill="url(#tunoGradient)"/>
    
    <!-- Texture dots pattern -->
    <circle cx="20" cy="20" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="30" cy="18" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="16" cy="28" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="34" cy="26" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="22" cy="35" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="32" cy="38" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="18" cy="42" r="1.5" fill="#E55A4E" opacity="0.6"/>
    <circle cx="28" cy="45" r="1.5" fill="#E55A4E" opacity="0.6"/>
    
    <!-- Green leaf accent -->
    <path d="M25 8 C22 6, 18 8, 18 12 C18 16, 22 18, 25 16 C28 18, 32 16, 32 12 C32 8, 28 6, 25 8 Z" fill="#66BB6A"/>
  </g>
  
  <!-- ERTUNO Text -->
  <g id="ertuno-text">
    <text x="55" y="20" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">ERTUNO</text>
    <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#B0BEC5">Live Messaging & Professional Services</text>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="tunoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4757;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA502;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>