<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Viewport and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ERTUNO" />
    
    <!-- SEO Meta Tags -->
    <title>ERTUNO - Creative Collaboration Platform</title>
    <meta name="description" content="A tech-forward platform that blends secure backend architecture with frontend artistry. Connect, collaborate, and create with ERTUNO." />
    <meta name="keywords" content="collaboration, creative platform, tech, design, development, teamwork, projects" />
    <meta name="author" content="ERTUNO Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ertuno.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ertuno.com" />
    <meta property="og:title" content="ERTUNO - Creative Collaboration Platform" />
    <meta property="og:description" content="A tech-forward platform that blends secure backend architecture with frontend artistry. Connect, collaborate, and create with ERTUNO." />
    <meta property="og:image" content="https://ertuno.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ERTUNO" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ertuno.com" />
    <meta property="twitter:title" content="ERTUNO - Creative Collaboration Platform" />
    <meta property="twitter:description" content="A tech-forward platform that blends secure backend architecture with frontend artistry. Connect, collaborate, and create with ERTUNO." />
    <meta property="twitter:image" content="https://ertuno.com/og-image.jpg" />
    <meta name="twitter:creator" content="@ertuno" />
    <meta name="twitter:site" content="@ertuno" />
    
    <!-- Theme and Brand Colors -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="msapplication-TileColor" content="#0ea5e9" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                800: '#075985', 900: '#0c4a6e', 950: '#082f49'
              },
              secondary: {
                50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047',
                400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207',
                800: '#854d0e', 900: '#713f12', 950: '#422006'
              },
              accent: {
                50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4',
                400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d',
                800: '#9d174d', 900: '#831843', 950: '#500724'
              }
            },
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif'],
              'display': ['Poppins', 'system-ui', 'sans-serif']
            }
          }
        }
      }
    </script>

    <!-- DNS Prefetch for Performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//www.google-analytics.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ERTUNO",
      "description": "A tech-forward platform that blends secure backend architecture with frontend artistry",
      "url": "https://ertuno.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "ERTUNO Team"
      }
    }
    </script>
    
    <!-- Performance and Loading -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
